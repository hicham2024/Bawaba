name: Add Cartas arabes 103 image to article

on:
  push:
    paths:
      - '.github/workflows/add-doc103-image.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert document 103 image block
        shell: python
        run: |
          from pathlib import Path
          p=Path('morocco-iberian-diplomacy/index.html')
          t=p.read_text(encoding='utf-8')
          old='''<article class="doc-card text-only"><header class="doc-head"><span class="date">20 سبتمبر 1351</span><h3>فارس بن أبي الحسن يبعث سفيراً إلى بيدرو الرابع</h3></header><div class="doc-body"><div class="doc-text"><div class="ref">ACA,COLECCIONES,Cartas árabes,núm.103</div><p>كتب فارس بن أبي الحسن من فاس إلى بيدرو الرابع ملك أراغون معلناً إرسال سفير للتفاوض بشأن مطالبة مرتبطة بسفينة أراغونية، مع عرض الشكاوى المتعلقة بأعمال القرصنة من الجانبين.</p><div class="actions"><a class="button" href="https://pares.mcu.es/ParesBusquedas20/catalogo/find?archivo=6&amp;idAut=100706&amp;nomAut=Saet%C3%ADas&amp;tipoAsocAut=1" target="_blank" rel="noopener">وثيقة 20 سبتمبر 1351 في PARES</a></div></div></div></article>'''
          new='''<article class="doc-card"><header class="doc-head"><span class="date">20 سبتمبر 1351</span><h3>فارس بن أبي الحسن يجيب عن شكاوى القرصنة ويبعث سفيراً إلى بيدرو الرابع</h3></header><div class="doc-body"><div class="doc-text"><div class="ref">ACA,COLECCIONES,Cartas árabes,núm.103</div><p>كتب فارس بن أبي الحسن من فاس إلى بيدرو الرابع ملك أراغون، جواباً عن شكاوى تتعلق بأعمال القرصنة، مبيّناً في المقابل ما يرتكبه بعض رعايا الملك الأراغوني من اعتداءات مماثلة. كما ترتبط المراسلة بإرسال سفير للتفاوض وتسوية المطالب العالقة بين الطرفين.</p><div class="actions"><a class="button" href="https://pares.mcu.es/ParesBusquedas20/catalogo/find?archivo=6&amp;idAut=100706&amp;nomAut=Saet%C3%ADas&amp;tipoAsocAut=1" target="_blank" rel="noopener">وثيقة 20 سبتمبر 1351 في PARES</a></div></div><figure class="doc-visual"><img src="/morocco-iberian-diplomacy/images/cartas-arabes-103-1351.jpg" loading="lazy" decoding="async" alt="الأصل العربي لرسالة فارس بن أبي الحسن من فاس إلى بيدرو الرابع بشأن شكاوى القرصنة، 20 سبتمبر 1351"><figcaption>الأصل العربي عالي الدقة للرسالة رقم 103 المحفوظة في أرشيف تاج أراغون. المصدر: <span dir="ltr">ACA,COLECCIONES,Cartas árabes,núm.103</span>. انقر على الصورة للتكبير.</figcaption></figure></div></article>'''
          if old not in t:
              raise SystemExit('Target 1351 article not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
      - name: Commit article update
        run: |
          rm -f .github/workflows/add-doc103-image.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add original Cartas arabes 103 image"
          git push
