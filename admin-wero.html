<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Validation Wero | Bawaba</title><style>:root{--g:#0d3a2e;--gold:#d8a737;--paper:#f6efe2;--s:#fffdf8;--line:#dfd2bc;--muted:#68726c}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:#15231d}.wrap{width:min(1000px,calc(100% - 32px));margin:34px auto}h1{color:var(--g)}.login,.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:240px;padding:11px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:white}.approve{background:#dff1e5;color:#14532d}.reject{background:#ffe5e0;color:#7b3026}.meta{color:var(--muted);font-size:.85rem}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;margin-right:6px}.link{word-break:break-all;background:#eef4f1;padding:10px;border-radius:10px;margin:10px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}</style></head><body><main class="wrap"><h1>Validation des paiements Wero</h1><div class="login"><div class="row"><input id="key" type="password" placeholder="Clé administrateur Wero"><button class="btn primary" id="load">Afficher les demandes</button></div><p class="meta">Après avoir vérifié le paiement de 4,99 € dans ING/Wero, cliquez sur « Valider ». Bawaba génère alors un lien privé valable 7 jours et limité à 5 téléchargements.</p></div><section id="list"></section></main><script>const list=document.getElementById('list'),keyEl=document.getElementById('key');keyEl.value=sessionStorage.getItem('wero-admin-key')||'';const labels={ar:'Arabe',fr:'Français',en:'English',es:'Español',nl:'Nederlands',it:'Italiano'};async function api(method,body){const key=keyEl.value.trim();sessionStorage.setItem('wero-admin-key',key);const r=await fetch('/api/wero-admin',{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(await r.text());return r.json()}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(items){if(!items.length){list.innerHTML='<div class="empty">Aucune demande Wero.</div>';return}list.innerHTML=items.map(x=>`<article class="card"><div><span class="tag">${esc(x.status)}</span><span class="tag">${esc(labels[x.lang]||x.lang)}</span><strong>4,99 €</strong></div><h3>${esc(x.email)}</h3><p class="meta">Nom/référence : ${esc(x.name||'—')} ${x.reference?'• '+esc(x.reference):''}<br>Demande : ${new Date(x.createdAt).toLocaleString('fr-BE')}</p>${x.downloadUrl?`<div class="link">${esc(x.downloadUrl)}</div>`:''}<div class="actions">${x.status==='pending'?`<button class="btn approve" data-id="${x.id}" data-action="approve">Valider le paiement</button><button class="btn reject" data-id="${x.id}" data-action="reject">Refuser</button>`:''}${x.downloadUrl?`<button class="btn primary" data-copy="${esc(x.downloadUrl)}">Copier le lien</button><a class="btn primary" href="mailto:${encodeURIComponent(x.email)}?subject=${encodeURIComponent('Votre livre Bawaba')}&body=${encodeURIComponent('Bonjour,\n\nVotre paiement Wero a été validé. Voici votre lien privé de téléchargement, valable 7 jours et limité à 5 téléchargements :\n\n'+x.downloadUrl+'\n\nMerci.')}" style="text-decoration:none">Envoyer par e-mail</a>`:''}</div></article>`).join('')}async function load(){try{const d=await api('GET');draw(d.items)}catch(e){list.innerHTML='<div class="card">Accès refusé ou erreur de configuration.</div>'}}document.getElementById('load').onclick=load;list.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.copy){await navigator.clipboard.writeText(b.dataset.copy);b.textContent='Lien copié';return}if(b.dataset.id){b.disabled=true;try{await api('POST',{id:b.dataset.id,action:b.dataset.action});await load()}catch(err){alert('Erreur : '+err.message)}finally{b.disabled=false}}});</script></body></html>
