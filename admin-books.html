<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bawaba — Administration des Bookstories</title>
<style>
:root{--green:#173f32;--gold:#d9b33f;--paper:#f6f0e3;--ink:#15382e;--red:#a33131}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:34px 20px}h1{font-family:Georgia,serif;font-size:34px;margin:0 0 8px}.lead{color:#6d6659;margin-bottom:24px}.auth,.panel{background:#fffdf8;border:1px solid #dfd2b4;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0000000a}.auth{display:flex;gap:12px;align-items:end;margin-bottom:22px}.field{flex:1}label{display:block;font-weight:700;margin-bottom:7px}input[type=password],input[type=file]{width:100%;padding:12px;border:1px solid #d8ccb1;border-radius:10px;background:white}button{border:0;border-radius:10px;padding:12px 17px;background:var(--green);color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.refresh{background:var(--gold);color:#17382e}.summary{margin:16px 0;font-weight:700}.dynasty{margin:26px 0}.dynasty h2{font-family:Georgia,serif;border-bottom:2px solid var(--gold);padding-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #ded4bd;border-radius:14px;padding:15px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.status{font-size:13px;font-weight:800}.ok{color:#23744c}.missing{color:var(--red)}.msg{font-size:13px;margin-top:9px;min-height:18px;color:#625b4f}@media(max-width:800px){.grid{grid-template-columns:1fr}.auth{display:block}.auth button{margin-top:10px;width:100%}}
</style>
</head><body><main class="wrap">
<h1>Administration des Bookstories</h1>
<p class="lead">Charge les PDF privés destinés à être livrés après paiement. La clé reste uniquement dans cette session de navigateur.</p>
<div class="auth"><div class="field"><label for="secret">Clé administrateur</label><input id="secret" type="password" autocomplete="off" placeholder="WERO_ADMIN_KEY / EBOOK_UPLOAD_SECRET"></div><button class="refresh" id="refresh">Vérifier les PDF</button></div>
<div class="panel"><div id="summary" class="summary">Clique sur « Vérifier les PDF ».</div><div id="books"></div></div>
</main>
<script>
const dynasties=[['idrissides','Idrissides'],['almoravides','Almoravides'],['almohades','Almohades']];
const langs=[['ar','Arabe'],['fr','Français'],['en','English'],['es','Español'],['nl','Nederlands'],['it','Italiano']];
let status={};
function render(){const root=document.getElementById('books');root.innerHTML='';for(const [book,title] of dynasties){const sec=document.createElement('section');sec.className='dynasty';sec.innerHTML=`<h2>${title}</h2><div class="grid"></div>`;const grid=sec.querySelector('.grid');for(const [lang,label] of langs){const key=`${book}/${lang}.pdf`,present=!!status[key];const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="top"><strong>${label}</strong><span class="status ${present?'ok':'missing'}">${present?'✓ Disponible':'✕ Manquant'}</span></div><input type="file" accept="application/pdf,.pdf"><button style="margin-top:10px;width:100%">Téléverser</button><div class="msg"></div>`;const input=card.querySelector('input'),btn=card.querySelector('button'),msg=card.querySelector('.msg');btn.onclick=async()=>{const secret=document.getElementById('secret').value.trim(),file=input.files[0];if(!secret){msg.textContent='Saisis d’abord la clé administrateur.';return}if(!file){msg.textContent='Choisis un fichier PDF.';return}btn.disabled=true;msg.textContent='Téléversement…';try{const r=await fetch(`/api/upload-book?key=${encodeURIComponent(key)}&secret=${encodeURIComponent(secret)}`,{method:'POST',headers:{'Content-Type':'application/pdf'},body:file});const text=await r.text();if(!r.ok)throw new Error(text||`HTTP ${r.status}`);msg.textContent='✓ PDF enregistré dans le store privé.';status[key]=true;render();document.getElementById('summary').textContent='PDF enregistré. Tu peux continuer avec les autres éditions.'}catch(e){msg.textContent='Erreur : '+e.message}finally{btn.disabled=false}};grid.appendChild(card)}root.appendChild(sec)}}
async function refresh(){const s=document.getElementById('summary');s.textContent='Vérification…';try{const r=await fetch('/api/ebook-status',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();status={};(d.status||[]).forEach(x=>status[x.key]=x.present);s.textContent=`${d.present} PDF présents sur ${d.expected} — ${d.missing.length} manquants.`;render()}catch(e){s.textContent='Impossible de vérifier : '+e.message}}
document.getElementById('refresh').onclick=refresh;render();
</script></body></html>
