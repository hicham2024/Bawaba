name: Fix Matthew Paris 1213 entry

on:
  push:
    paths:
      - '.github/workflows/fix-matthew-paris-1213.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Matthew Paris card
        shell: python
        run: |
          from pathlib import Path
          p = Path('morocco-iberian-diplomacy/index.html')
          t = p.read_text(encoding='utf-8')
          old = '''<article class="doc-card"><header class="doc-head"><span class="date">منتصف القرن الثالث عشر</span><h3><span dir="ltr">Marrochiae</span> في مخطوط ماثيو باريس</h3></header><div class="doc-body"><div class="doc-text"><div class="ref">Cambridge, Corpus Christi College, Parker Library, MS 16 II, f.37v</div><p>يرد اسم المغرب في مخطوط <span dir="ltr">Chronica Majora</span> لماثيو باريس ضمن العبارة اللاتينية <span dir="ltr"><strong>regem magnum Affricae, Marrochiae et Hyspaniae</strong></span>. وتُظهر الصورة الأولى موضع النص داخل الورقتين المتقابلتين، بينما تقرّب الصورة الثانية السطر الذي تظهر فيه كلمة <span dir="ltr">Marrochiae</span> بوضوح.</p>'''
          new = '''<article class="doc-card"><header class="doc-head"><span class="date">1213م</span><h3>سفارة الملك جون إلى السلطان الموحدي وذكر <span dir="ltr">Marrochiae</span> في <span dir="ltr">Chronica Majora</span></h3></header><div class="doc-body"><div class="doc-text"><div class="ref">Cambridge, Corpus Christi College, Parker Library, MS 16 II, f.37v</div><p>يضع المؤرخ الإنجليزي <strong>ماثيو باريس</strong> خبر سفارة الملك جون إلى السلطان الموحدي ضمن أحداث سنة <strong>1213م</strong> في كتابه <span dir="ltr"><em>Chronica Majora</em></span>. وفي سياق هذا الخبر يرد اسم المغرب صراحةً ضمن العبارة اللاتينية <span dir="ltr"><strong>regem magnum Affricae, Marrochiae et Hyspaniae</strong></span>. وتُظهر الصورة الأولى موضع النص داخل الورقتين المتقابلتين، بينما تقرّب الصورة الثانية السطر الذي تظهر فيه كلمة <span dir="ltr">Marrochiae</span> بوضوح.</p>'''
          if old not in t:
              raise SystemExit('Matthew Paris block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco-iberian-diplomacy/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct Matthew Paris entry to 1213"
          git push
