name: Rotate 1316 document

on:
  push:
    paths:
      - '.github/workflows/rotate-1316-document.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rotate 1316 archival image vertically
        shell: python
        run: |
          from pathlib import Path

          path = Path('morocco-iberian-diplomacy/index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '.method.method-document{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:22px;align-items:start}.method-document .doc-visual img{max-height:390px}@media(max-width:780px){.method.method-document{grid-template-columns:1fr}.method-document .doc-visual{order:-1}}'
          css_new = css_anchor + '\n    .doc-visual.doc-vertical{min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}.doc-visual.doc-vertical img{width:auto;height:300px;max-width:100%;max-height:none;object-fit:contain;transform:rotate(90deg);transform-origin:center}.doc-visual.doc-vertical figcaption{margin-top:36px;text-align:center;width:100%}@media(max-width:780px){.doc-visual.doc-vertical{min-height:360px}.doc-visual.doc-vertical img{height:260px}}'
          if '.doc-visual.doc-vertical{' not in text:
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css_new, 1)

          old = '<figure class="doc-visual"><img src="/morocco-iberian-diplomacy/images/cartas-arabes-135-1316.jpg" alt="الأصل العربي للرسالة رقم 135 المؤرخة في 3 أبريل 1316"><figcaption>رسالة زكريا من طرابلس إلى خايمي الثاني.</figcaption></figure>'
          new = '<figure class="doc-visual doc-vertical"><img src="/morocco-iberian-diplomacy/images/cartas-arabes-135-1316.jpg" alt="الأصل العربي للرسالة رقم 135 المؤرخة في 3 أبريل 1316"><figcaption>رسالة زكريا من طرابلس إلى خايمي الثاني.</figcaption></figure>'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'cartas-arabes-135-1316.jpg' in text and 'doc-visual doc-vertical' not in text:
              raise SystemExit('1316 image found but expected figure markup differs')

          path.write_text(text, encoding='utf-8')

      - name: Commit page update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco-iberian-diplomacy/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rotate 1316 archival document vertically"
          git push
