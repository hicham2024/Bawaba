:root{--g:#0d3a2e;--g2:#195744;--gold:#d8a737;--paper:#f6efe2;--s:#fffdf8;--ink:#15231d;--muted:#68726c;--line:#dfd2bc}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;line-height:1.65}body[dir="rtl"]{font-family:"Noto Kufi Arabic",Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:34px auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.brand{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;color:var(--g);text-decoration:none}.back{color:var(--g);font-weight:700;text-decoration:none;font-size:.85rem}.card{background:var(--s);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:0 20px 55px rgba(24,38,29,.12)}.head{background:linear-gradient(135deg,#0b3328,#195744);color:#fff;padding:30px;border-bottom:4px solid var(--gold)}.eyebrow{color:#f1d58b;font-weight:800;font-size:.76rem}.head h1{font-family:"Source Serif 4",serif;margin:7px 0 7px;font-size:clamp(1.7rem,4vw,2.5rem)}body[dir="rtl"] .head h1{font-family:"Noto Kufi Arabic",sans-serif}.head p{margin:0;color:#dce7e1;font-size:.86rem}.price{font-size:2.25rem;font-weight:800;margin-top:12px}.body{padding:26px 30px 30px}.selection{background:#edf3ef;border:1px solid #c9d9d1;border-radius:14px;padding:13px 15px;margin-bottom:20px}.selection strong{color:var(--g)}#paypal-button-container{min-height:48px}.status{display:none;margin-top:18px;padding:15px;border-radius:14px}.status.show{display:block}.status.ok{background:#e9f5ed;border:1px solid #a9cfb6;color:#245636}.status.err{background:#fff0ed;border:1px solid #e1b0a7;color:#7b3026}.download{display:none;margin-top:14px;background:var(--g);color:#fff;text-decoration:none;border-radius:12px;min-height:50px;align-items:center;justify-content:center;font-weight:800}.download.show{display:flex}.info{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:.78rem}.setup{background:#ff <body><main class="wrap">

<section class="card"><header class="head"><div id="eyebrow" class="eyebrow">Livre électronique PDF</div><h1 id="heading">Paiement sécurisé</h1><p id="intro">Le téléchargement est débloqué automatiquement uniquement après confirmation du paiement.</p><div class="price">5,00 €</div></header>
<div class="body"><div class="selection"><span id="selectedLabel">Édition choisie :</span> <strong id="edition">—</strong></div>
<div id="setup" class="setup"></div><div id="paypal-button-container"></div>
<div id="status" class="status"></div><a id="download" class="download" href="#"></a>
<div id="info" class="info"></div></div></section></main>
<script>
const q=new URLSearchParams(location.search),book=q.get('book')||'almoravides',lang=q.get('lang')||'fr';
const allowedBooks=['idrissides','almoravides','almohades'],allowedLangs=['ar','fr','en','es','nl','it'];
const safeBook=allowedBooks.includes(book)?book:'almoravides',safeLang=allowedLangs.includes(lang)?lang:'fr';
const names={

 fr:{idrissides:'Les Idrissides du Maroc',almoravides:'Les Almoravides marocains',almohades:'Les Almohades marocains'},
 en:{idrissides:'The Idrisids of Morocco',almoravides:'The Moroccan Almoravids',almohades:'The Moroccan Almohads'},
 es:{idrissides:'Los Idrisíes de Marruecos',almoravides:'Los Almorávides marroquíes',almohades:'Los Almohades marroquíes'},
 nl:{idrissides:'De Idrisiden van Marokko',almoravides:'De Marokkaanse Almoraviden',almohades:'De Marokkaanse Almohaden'},
 it:{idrissides:'Gli Idrisidi del Marocco',almoravides:'Gli Almoravidi marocchini',almohades:'Gli Almohadi marocchini'}
};
const label={ar:'العربية',fr:'Français',en:'English',es:'Español',nl:'Nederlands',it:'Italiano'};
const T={
 fr:{dir:'ltr',back:'← Retour aux livres',eye:'Livre électronique PDF',head:'Paiement sécurisé',intro:'Le téléchargement est débloqué automatiquement uniquement après confirmation du paiement.',sel:'Édition choisie :',setup:'Le paiement automatique PayPal est en cours de configuration.',download:'Télécharger mon livre PDF',info:'<strong>Protection de votre achat :</strong> Bawaba vérifie le paiement de 5,00 € puis génère un lien privé valable 7 jours et limité à 5 téléchargements.',approve:'Paiement approuvé. Vérification en cours…',confirmed:'Paiement confirmé. Votre PDF est prêt.',cancel:'Paiement annulé. Aucun débit n’a été confirmé.',error:'Une erreur PayPal est survenue. Réessayez.',load:'Impossible de charger PayPal. Réessayez plus tard.'},
 en:{dir:'ltr',back:'← Back to books',eye:'PDF e-book',head:'Secure payment',intro:'The download is unlocked automatically only after PayPal confirms the payment.',sel:'Selected edition:',setup:'Automatic PayPal payment is still being configured.',download:'Download my PDF',info:'<strong>Purchase protection:</strong> Bawaba verifies the €5.00 payment and generates a private link valid for 7 days and limited to 5 downloads.',approve:'Payment approved. Verification in progress…',confirmed:'Payment confirmed. Your PDF is ready.',cancel:'Payment cancelled. No charge was confirmed.',error:'A PayPal error occurred. Please try again.',load:'PayPal could not be loaded. Please try again later.'},
 ar:{dir:'rtl',back:'العودة إلى الكتب ←',eye:'كتاب إلكتروني PDF',head:'دفع آمن',intro:'يُفتح التنزيل تلقائياً فقط بعد تأكيد الدفع من PayPal.',sel:'النسخة المختارة:',setup:'لا يزال إعداد الدفع التلقائي عبر PayPal جارياً.',download:'تحميل الكتاب PDF',info:'<strong>حماية الشراء:</strong> تتحقق بوابة من دفع 5 يورو ثم تنشئ رابطاً خاصاً صالحاً لمدة 7 أيام ومحدوداً في 5 تنزيلات.',approve:'تمت الموافقة على الدفع. جارٍ التحقق…',confirmed:'تم تأكيد الدفع. كتابك جاهز.',cancel:'تم إلغاء الدفع ولم يتم تأكيد أي خصم.',error:'حدث خطأ في PayPal. حاول مرة أخرى.',load:'تعذر تحميل PayPal. حاول لاحقاً.'},
 es:{dir:'ltr',back:'← Volver a los libros',eye:'Libro electrónico PDF',head:'Pago seguro',intro:'La descarga se habilita automáticamente solo después de que PayPal confirme el pago.',sel:'Edición elegida:',setup:'El pago automático de PayPal aún se está configurando.',download:'Descargar mi PDF',info:'<strong>Protección de compra:</strong> Bawaba verifica el pago de 5,00 € y genera un enlace privado válido durante 7 días y limitado a 5 descargas.',approve:'Pago aprobado. Verificación en curso…',confirmed:'Pago confirmado. Tu PDF está listo.',cancel:'Pago cancelado. No se confirmó ningún cargo.',error:'Se produjo un error de PayPal. Inténtalo de nuevo.',load:'No se pudo cargar PayPal. Inténtalo más tarde.'},
 nl:{dir:'ltr',back:'← Terug naar boeken',eye:'PDF e-book',head:'Veilige betaling',intro:'De download wordt pas automatisch vrijgegeven nadat PayPal de betaling heeft bevestigd.',sel:'Gekozen editie:',setup:'De automatische PayPal-betaling wordt nog ingesteld.',download:'Mijn PDF downloaden',info:'<strong>Aankoopbeveiliging:</strong> Bawaba controleert de betaling van € 5,00 en maakt een privékoppeling die 7 dagen geldig is en maximaal 5 downloads toestaat.',approve:'Betaling goedgekeurd. Controle bezig…',confirmed:'Betaling bevestigd. Je PDF is klaar.',cancel:'Betaling geannuleerd. Er is geen afschrijving bevestigd.',error:'Er is een PayPal-fout opgetreden. Probeer opnieuw.',load:'PayPal kon niet worden geladen. Probeer later opnieuw.'},
 it:{dir:'ltr',back:'← Torna ai libri',eye:'E-book PDF',head:'Pagamento sicuro',intro:'Il download viene sbloccato automaticamente solo dopo la conferma del pagamento da parte di PayPal.',sel:'Edizione scelta:',setup:'Il pagamento automatico PayPal è ancora in fase di configurazione.',download:'Scarica il mio PDF',info:'<strong>Protezione dell’acquisto:</strong> Bawaba verifica il pagamento di 5,00 € e genera un link privato valido 7 giorni e limitato a 5 download.',approve:'Pagamento approvato. Verifica in corso…',confirmed:'Pagamento confermato. Il tuo PDF è pronto.',cancel:'Pagamento annullato. Nessun addebito è stato confermato.',error:'Si è verificato un errore PayPal. Riprova.',load:'Impossibile caricare PayPal. Riprova più tardi.'}
};
const t=T[safeLang];document.documentElement.lang=safeLang;document.documentElement.dir=t.dir;document.body.setAttribute('dir',t.dir);
back.textContent=t.back;back.href='/livres.html?lang='+safeLang;eyebrow.textContent=t.eye;heading.textContent=t.head;intro.textContent=t.intro;selectedLabel.textContent=t.sel;edition.textContent=label[safeLang]+' — '+names[safeLang][safeBook];setup.textContent=t.setup;download.textContent=t.download;info.innerHTML=t.info;
const statusEl=document.getElementById('status');function message(text,type){statusEl.textContent=text;statusEl.className='status show '+type;}
async function init(){try{const cfg=await fetch('/api/paypal-config',{cache:'no-store'}).then(r=>r.json());if(!cfg.configured){setup.classList.add('show');return;}const s=document.createElement('script');s.src=`https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.clientId)}&currency=EUR&intent=capture`;s.onload=render;s.onerror=()=>message(t.load,'err');document.head.appendChild(s);}catch(e){setup.classList.add('show');}}
function render(){window.paypal.Buttons({style:{layout:'vertical',shape:'rect',label:'paypal'},createOrder:async()=>{const r=await fetch('/api/paypal-create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({book:safeBook,lang:safeLang})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Order creation failed');return d.id;},onApprove:async(data)=>{message(t.approve,'ok');const r=await fetch('/api/paypal-capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderID:data.orderID})});const d=await r.json();if(!r.ok||d.status!=='COMPLETED'){message(d.error||t.error,'err');return;}message(t.confirmed,'ok');download.href=d.downloadUrl;download.classList.add('show');},onCancel:()=>message(t.cancel,'err'),onError:()=>message(t.error,'err')}).render('#paypal-button-container');}
init();
</script></body></html>
