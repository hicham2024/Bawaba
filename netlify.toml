[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/assets/cards/idrissids.webp"
  to = "/assets/cards/idrissids-book.svg"
  status = 200
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/api/paypal-config"
  to = "/.netlify/functions/paypal-config"
  status = 200

[[redirects]]
  from = "/api/paypal-create"
  to = "/.netlify/functions/paypal-create"
  status = 200

[[redirects]]
  from = "/api/paypal-capture"
  to = "/.netlify/functions/paypal-capture"
  status = 200

[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

[[redirects]]
  from = "/api/upload-book"
  to = "/.netlify/functions/upload-book"
  status = 200

[[redirects]]
  from = "/api/wero-request"
  to = "/.netlify/functions/wero-request"
  status = 200

[[redirects]]
  from = "/api/wero-admin"
  to = "/.netlify/functions/wero-admin"
  status = 200
