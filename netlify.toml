[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Book cover fallbacks: proxy the three stable cover URLs directly from the
# repository so /livres.html never depends on Vite copying binary assets.
[[redirects]]
  from = "/assets/cards/idrissids.webp"
  to = "https://raw.githubusercontent.com/hicham2024/Bawaba/main/assets/cards/idrissids.webp"
  status = 200
  force = true

[[redirects]]
  from = "/assets/cards/almoravids.webp"
  to = "https://raw.githubusercontent.com/hicham2024/Bawaba/main/assets/cards/almoravids.webp"
  status = 200
  force = true

[[redirects]]
  from = "/assets/cards/almohads.webp"
  to = "https://raw.githubusercontent.com/hicham2024/Bawaba/main/assets/cards/almohads.webp"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal-config"
  to = "/.netlify/functions/paypal-config"
  status = 200

[[redirects]]
  from = "/api/paypal-create"
  to = "/.netlify/functions/paypal-create"
  status = 200

[[redirects]]
  from = "/api/paypal-capture"
  to = "/.netlify/functions/paypal-capture"
  status = 200

[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

[[redirects]]
  from = "/api/upload-book"
  to = "/.netlify/functions/upload-book"
  status = 200

[[redirects]]
  from = "/api/ebook-status"
  to = "/.netlify/functions/ebook-status"
  status = 200

[[redirects]]
  from = "/api/wero-request"
  to = "/.netlify/functions/wero-request"
  status = 200

[[redirects]]
  from = "/api/wero-admin"
  to = "/.netlify/functions/wero-admin"
  status = 200
