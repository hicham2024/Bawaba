<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Virements bancaires | Bawaba</title><style>
:root{--g:#0d3a2e;--gold:#d8a737;--paper:#f6efe2;--s:#fffdf8;--line:#dfd2bc;--muted:#68726c;--red:#7b3026}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,sans-serif;color:#15231d}.wrap{width:min(1050px,calc(100% - 32px));margin:34px auto}h1{color:var(--g)}.login,.card{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:240px;padding:11px;border:1px solid var(--line);border-radius:10px}.btn{display:inline-block;border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:white}.approve{background:#dff1e5;color:#14532d}.reject{background:#ffe5e0;color:var(--red)}.meta{color:var(--muted);font-size:.88rem;line-height:1.6}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;margin:0 0 6px 6px}.reference{font-size:1.08rem;font-weight:800;color:var(--g);background:#eef4f1;padding:10px;border-radius:10px}.error{color:var(--red);font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}
</style></head><body><main class="wrap"><h1>Validation des virements bancaires</h1><div class="login"><div class="row"><input id="key" type="password" placeholder="Clé administrateur"><button class="btn primary" id="load">Afficher les virements</button></div><p class="meta">Vérifiez dans ING que le montant de <strong>4,99 €</strong> est arrivé avec la référence indiquée. Cliquez ensuite sur « Valider et envoyer le PDF » : le client reçoit automatiquement son PDF à l’adresse e-mail fournie.</p></div><section id="list"></section></main><script>
const list=document.getElementById('list'),keyEl=document.getElementById('key');
keyEl.value=sessionStorage.getItem('bank-transfer-admin-key')||'';
const languageLabels={ar:'Arabe',fr:'Français',en:'English',es:'Español',nl:'Nederlands',it:'Italiano'};
const bookLabels={idrissides:'Idrissides',almoravides:'Almoravides',almohades:'Almohades',marinides:'Mérinides'};
async function api(method,body){const key=keyEl.value.trim();sessionStorage.setItem('bank-transfer-admin-key',key);const response=await fetch('/api/bank-transfer-admin',{method,headers:{'Content-Type':'application/json','x-admin-key':key},body:body?JSON.stringify(body):undefined});const data=await response.json().catch(()=>({error:'Erreur serveur'}));if(!response.ok){const error=new Error(data.error||'Erreur');error.data=data;throw error}return data}
function esc(value=''){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function statusLabel(status){return {pending:'En attente',sending:'Envoi en cours',sent:'PDF envoyé',email_failed:'Échec de l’e-mail',rejected:'Refusé'}[status]||status}
function draw(items){if(!items.length){list.innerHTML='<div class="empty">Aucun virement enregistré.</div>';return}list.innerHTML=items.map(item=>`<article class="card"><div><span class="tag">${esc(statusLabel(item.status))}</span><span class="tag">${esc(bookLabels[item.book]||item.book)}</span><span class="tag">${esc(languageLabels[item.lang]||item.lang)}</span></div><h3>${esc(item.email)}</h3><div class="reference">Référence à contrôler : ${esc(item.reference)}</div><p class="meta">Montant : <strong>${esc(item.amount)} ${esc(item.currency)}</strong><br>Demande : ${new Date(item.createdAt).toLocaleString('fr-BE')}${item.emailSentAt?`<br>PDF envoyé : ${new Date(item.emailSentAt).toLocaleString('fr-BE')}`:''}</p>${item.emailError?`<p class="error">${esc(item.emailError)}</p>`:''}<div class="actions">${['pending','email_failed'].includes(item.status)?`<button class="btn approve" data-id="${esc(item.id)}" data-action="approve">${item.status==='email_failed'?'Réessayer l’envoi':'Valider et envoyer le PDF'}</button><button class="btn reject" data-id="${esc(item.id)}" data-action="reject">Refuser</button>`:''}${item.downloadUrl?`<a class="btn primary" href="${esc(item.downloadUrl)}" target="_blank" rel="noopener">Tester le lien privé</a>`:''}</div></article>`).join('')}
async function load(){try{draw((await api('GET')).items)}catch(error){list.innerHTML='<div class="card error">Accès refusé ou configuration incomplète.</div>'}}
document.getElementById('load').onclick=load;
list.addEventListener('click',async event=>{const button=event.target.closest('button[data-id]');if(!button)return;button.disabled=true;button.textContent='Traitement…';try{await api('POST',{id:button.dataset.id,action:button.dataset.action});await load()}catch(error){alert('Erreur : '+error.message);await load()}finally{button.disabled=false}});
</script></body></html>
