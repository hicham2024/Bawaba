name: Update document 112 text

on:
  push:
    paths:
      - '.github/workflows/update-doc112-text.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update title and text
        shell: python
        run: |
          from pathlib import Path
          p = Path('morocco-iberian-diplomacy/index.html')
          t = p.read_text(encoding='utf-8')
          old_title = 'من أخبار تلمسان إلى تنظيم سفر سفير المغرب'
          new_title = 'السلطان المريني أبو سالم إبراهيم يوفد سفيره إلى ملك أراغون'
          old_text = '''<p>في الرسالة رقم 110 يكتب إبراهيم بن أبي الحسن من مراكش إلى بيدرو الرابع بأخبار عسكرية وسياسية مرتبطة بتلمسان. وبعد ثلاثة أيام، في الرسالة رقم 112، يكتب إبراهيم بن أبي الحسن، سلطان المغرب، إلى برنات كابريرا مخبراً إياه بسفر سفيره إلى ملك أراغون، وراجياً منه أن يعينه ويلبي ما قد يحتاج إليه أثناء المهمة.</p><p>تُظهر الرسالتان انتقال الملف من تبادل الأخبار السياسية إلى التنظيم العملي لسفارة مرينية متجهة إلى البلاط الأراغوني.</p>'''
          new_text = '''<p>يُخطر السلطان المغربي المريني <strong>(أبو سالم إبراهيم)</strong> المسؤول الأراغوني برنات دي كابريرا بـ <strong>سفر سفيره (مبعوثه الدبلوماسي) إلى ملك أراغون</strong> (بيدرو الرابع)، ويطلب منه حسن استقبال السفير وتقديم التسهيلات والترحاب والمساعدة له في كل ما قد يحتاجه خلال أداء مهمته الدبلوماسية.</p>'''
          if old_title not in t:
              raise SystemExit('Old title not found')
          if old_text not in t:
              raise SystemExit('Old text not found')
          t = t.replace(old_title, new_title, 1)
          t = t.replace(old_text, new_text, 1)
          p.write_text(t, encoding='utf-8')
      - name: Commit changes and cleanup
        run: |
          rm -f .github/workflows/update-doc112-text.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Update Cartas arabes 112 title and description"
          git push
