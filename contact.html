<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="تواصل مع بوابة البحوث التاريخية لإرسال الأسئلة والملاحظات والاقتراحات المتعلقة بتاريخ المغرب والوثائق والأبحاث."><meta name="robots" content="index,follow"><link rel="canonical" href="https://bawaba.eu/contact/"><title>اتصل بنا | بوابة البحوث التاريخية</title><link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--g:#0d3a2e;--gold:#d8a737;--paper:#f6efe2;--surface:#fffdf8;--line:#dfd2bc;--ink:#15231d;--muted:#68726c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Kufi Arabic",Tahoma,Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:38px auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.brand{color:var(--g);font-weight:800;text-decoration:none}.back{color:var(--g);text-decoration:none;font-weight:700}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 55px rgba(24,38,29,.12)}.head{background:linear-gradient(135deg,#0b3328,#195744);color:#fff;padding:30px;border-bottom:4px solid var(--gold)}.head h1{margin:0 0 7px;font-size:2rem}.head p{margin:0;color:#dce7e1}.body{padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;color:var(--g)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:170px;resize:vertical}.submit{margin-top:18px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}.note{margin-top:14px;color:var(--muted);font-size:.8rem}.hidden{position:absolute;left:-9999px}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">بوابة البحوث التاريخية</a><a class="back" href="/">العودة إلى الموقع ←</a></div><section class="card"><header class="head"><h1>اتصل ببوابة البحوث التاريخية</h1><p>هل لديك سؤال أو ملاحظة أو اقتراح؟ أرسل رسالتك هنا.</p></header><div class="body"><form name="bawaba-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/merci"><input type="hidden" name="form-name" value="bawaba-contact"><p class="hidden"><label>لا تملأ هذا الحقل <input name="bot-field"></label></p><div class="grid"><div class="field"><label for="name">الاسم</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">بريدك الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field full"><label for="subject">الموضوع</label><select id="subject" name="subject"><option>سؤال عام</option><option>القصص المصوّرة / الكتب</option><option>الدفع أو التحميل</option><option>بحث تاريخي</option><option>موضوع آخر</option></select></div><div class="field full"><label for="message">الرسالة</label><textarea id="message" name="message" required></textarea></div></div><button class="submit" type="submit">إرسال الرسالة</button><p class="note">تُرسل رسالتك عبر النموذج الآمن للموقع، ولا يُعرض عنوان التواصل الخاص بالبوابة للعموم.</p></form></div></section></main></body></html>
