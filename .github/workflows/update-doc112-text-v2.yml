name: Update document 112 text v2

on:
  push:
    paths:
      - '.github/workflows/update-doc112-text-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Cartas arabes 112 card
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('morocco-iberian-diplomacy/index.html')
          t = p.read_text(encoding='utf-8')
          old_title = 'من أخبار تلمسان إلى تنظيم سفر سفير المغرب'
          new_title = 'السلطان المريني أبو سالم إبراهيم يوفد سفيره إلى ملك أراغون'
          if old_title not in t:
              raise SystemExit('Old title not found')
          t = t.replace(old_title, new_title, 1)
          pattern = re.compile(r'(<div class="ref">Cartas árabes,núm\.110 · núm\.112</div>).*?(<div class="actions">)', re.S)
          new_p = '<p>يُخطر السلطان المغربي المريني <strong>(أبو سالم إبراهيم)</strong> المسؤول الأراغوني برنات دي كابريرا بـ <strong>سفر سفيره (مبعوثه الدبلوماسي) إلى ملك أراغون</strong> (بيدرو الرابع)، ويطلب منه حسن استقبال السفير وتقديم التسهيلات والترحاب والمساعدة له في كل ما قد يحتاجه خلال أداء مهمته الدبلوماسية.</p>'
          t2, n = pattern.subn(r'\1' + new_p + r'\2', t, count=1)
          if n != 1:
              raise SystemExit(f'Card body replacement failed: {n}')
          p.write_text(t2, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morocco-iberian-diplomacy/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Cartas arabes 112 title and description"
          git push
