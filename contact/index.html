<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contacter Bawaba, la porte des recherches historiques consacrée à l&apos;histoire du Maroc."><meta name="robots" content="index,follow"><title>Contact | Bawaba</title><link rel="canonical" href="https://bawaba.eu/contact/"><style>:root{--g:#0d3a2e;--gold:#d8a737;--paper:#f6efe2;--surface:#fffdf8;--line:#dfd2bc;--ink:#15231d;--muted:#68726c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:38px auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.brand{color:var(--g);font-weight:800;text-decoration:none}.back{color:var(--g);text-decoration:none;font-weight:700}.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 20px 55px rgba(24,38,29,.12)}.head{background:linear-gradient(135deg,#0b3328,#195744);color:#fff;padding:30px;border-bottom:4px solid var(--gold)}.head h1{margin:0 0 7px;font-size:2rem}.head p{margin:0;color:#dce7e1}.body{padding:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-weight:700;color:var(--g)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;font:inherit;color:var(--ink)}textarea{min-height:170px;resize:vertical}.submit{margin-top:18px;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--g);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}.note{margin-top:14px;color:var(--muted);font-size:.8rem}.hidden{position:absolute;left:-9999px}@media(max-width:620px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><main class="wrap"><div class="top"><a class="brand" href="/">بوابة البحوث التاريخية</a><a class="back" href="/">← Retour au site</a></div><section class="card"><header class="head"><h1>Contactez Bawaba</h1><p>Une question, une remarque ou une proposition ? Envoyez votre message ici.</p></header><div class="body"><form name="bawaba-contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/merci.html"><input type="hidden" name="form-name" value="bawaba-contact"><p class="hidden"><label>Ne pas remplir <input name="bot-field"></label></p><div class="grid"><div class="field"><label for="name">Nom</label><input id="name" name="name" autocomplete="name" required></div><div class="field"><label for="email">Votre e-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="field full"><label for="subject">Sujet</label><select id="subject" name="subject"><option>Question générale</option><option>Bookstories / livres</option><option>Paiement ou téléchargement</option><option>Recherche historique</option><option>Autre</option></select></div><div class="field full"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div></div><button class="submit" type="submit">Envoyer le message</button><p class="note">Votre message est transmis via le formulaire sécurisé du site. L’adresse de contact de Bawaba n’est pas affichée publiquement.</p></form></div></section></main></body></html>
